name: Build Arena APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q "$(find . -maxdepth 1 -iname '*.zip' | head -n 1)"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
  working-directory: ArenaMobile
  run: |
    printf '\nandroid { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\nkotlin { jvmToolchain(17) }\n' >> app/build.gradle.kts
    gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Arena-APK
          path: ArenaMobile/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
